  <!-- Pre-paint theme & palette hydration (prevents flash before vault unlock) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('act_theme_pref');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        t = (t === 'dark') ? 'dark' : 'light';
        var p = localStorage.getItem('act_palette_pref');
        if (p !== 'musgo' && p !== 'sepia' && p !== 'niebla' && p !== 'custom') p = 'arcilla';
        var s = localStorage.getItem('act_surface_pref');
        s = (s === 'lino') ? 'lino' : 'editorial';
        var b = localStorage.getItem('act_buttons_pref');
        b = (b === 'editorial') ? 'editorial' : 'ultraligero';
        var ex = localStorage.getItem('act_explanations_pref');
        ex = (ex === 'hide') ? 'hide' : 'show';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-palette', p);
        document.documentElement.setAttribute('data-surface', s);
        document.documentElement.setAttribute('data-buttons', b);
        document.documentElement.setAttribute('data-explanations', ex);
        var colors = {
          arcilla: { light: '#F3EDE4', dark: '#1B1613' },
          musgo: { light: '#F6F3EC', dark: '#171614' },
          sepia: { light: '#F4ECD8', dark: '#1D1812' },
          niebla: { light: '#F2F3F5', dark: '#1A1C20' }
        };
        var defaultCustom = {
          light: { bg: '#F4F1EA', text: '#262420', accent: '#5D6E64' },
          dark: { bg: '#1B1D1C', text: '#EAECE9', accent: '#94ABA0' }
        };
        var isHex = function (v) { return typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v); };
        var relLum = function (hex) {
          var ch = [1, 3, 5].map(function (i) {
            var c = parseInt(hex.slice(i, i + 2), 16) / 255;
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
        };
        var getOnAccent = function (hex) {
          if (!isHex(hex)) return '#FAF8F4';
          var lBg = relLum(hex);
          var lDark = relLum('#1A1A18');
          var lLight = relLum('#FAF8F4');
          var cDark = (Math.max(lBg, lDark) + 0.05) / (Math.min(lBg, lDark) + 0.05);
          var cLight = (Math.max(lBg, lLight) + 0.05) / (Math.min(lBg, lLight) + 0.05);
          return cDark >= cLight ? '#1A1A18' : '#FAF8F4';
        };
        window.__KHORA_PALETTE_COLORS__ = colors;
        window.__KHORA_DEFAULT_CUSTOM_PALETTE__ = defaultCustom;
        window.__KHORA_GET_ON_ACCENT__ = getOnAccent;
        var themeCol = (colors[p] && colors[p][t]) ? colors[p][t] : '#F3EDE4';
        if (p === 'custom') {
          var rawCp = localStorage.getItem('act_custom_palette_pref');
          var cp = rawCp ? JSON.parse(rawCp) : null;
          var defMode = defaultCustom[t];
          var src = cp && cp[t] ? cp[t] : {};
          var bg = isHex(src.bg) ? src.bg : defMode.bg;
          var text = isHex(src.text) ? src.text : defMode.text;
          var accent = isHex(src.accent) ? src.accent : defMode.accent;
          document.documentElement.style.setProperty('--custom-bg', bg);
          document.documentElement.style.setProperty('--custom-text', text);
          document.documentElement.style.setProperty('--custom-accent', accent);
          document.documentElement.style.setProperty('--custom-on-accent', getOnAccent(accent));
          themeCol = bg;
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themeCol);
      } catch (e) {}
    })();
  </script>
