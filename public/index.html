<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Khora — Tu espacio ACT</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="Khora — Tu espacio ACT. Herramienta personal de Terapia de Aceptación y Compromiso para observar, aceptar y actuar hacia tus valores.">
  <meta name="theme-color" content="#355749">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Khora">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

  <!-- Core Therapeutic Styling -->
  <link rel="stylesheet" href="./css/styles.css?v=3.1.0">
</head>
<body>

  <div class="app-container">
    <!-- Top Global Header -->
    <header class="app-header">
      <div class="header-brand-cluster">
        <div class="brand-wrapper">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
              <path d="M12 12 2.1 12a10.1 10.1 0 0 0 9.9 10z"></path>
            </svg>
          </div>
          <div class="brand-title-group">
            <h1>Khora</h1>
            <p data-i18n="Tu espacio ACT">Tu espacio ACT</p>
          </div>
        </div>
        <button type="button" id="header-storage-warning" class="header-storage-warning hidden" title="Sin servidor de base de datos: tus datos se guardan solo en este navegador. Pulsa para ver detalles o exportar copia." aria-label="Aviso de almacenamiento local">
          <span aria-hidden="true">⚠️</span>
          <span id="header-storage-warning-text">Solo navegador</span>
        </button>
      </div>

      <div class="header-actions">
        <!-- SOS Quick Crisis Processing Button -->
        <button type="button" class="btn-sos" id="btn-sos-crisis" title="Procesar momento de saturación emocional" data-i18n-title="Procesar momento de saturación emocional">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          <span data-i18n="Crisis ACT">Crisis ACT</span>
        </button>

        <!-- Quick Lock Button (Visible only when Privacy Vault is enabled) -->
        <button type="button" class="btn-icon" id="btn-quick-lock" title="Bloquear pantalla ahora" aria-label="Bloquear aplicación" data-i18n-title="Bloquear pantalla ahora" data-i18n-aria-label="Bloquear aplicación" style="display: none;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>

        <!-- Contextual Screen Help & ACT Tutorial Button -->
        <button type="button" class="btn-icon" id="btn-context-help" title="Guía y ayuda de esta pantalla" aria-label="Ayuda de esta pantalla" data-i18n-title="Guía y ayuda de esta pantalla" data-i18n-aria-label="Ayuda de esta pantalla" style="font-weight: 800; font-size: 0.92rem;">
          ?
        </button>

        <!-- Language Switcher (ES / EN) -->
        <button type="button" class="btn-icon" id="btn-lang-toggle" title="Cambiar idioma (ES / EN)" aria-label="Cambiar idioma (ES / EN)" data-i18n-title="Cambiar idioma (ES / EN)" data-i18n-aria-label="Cambiar idioma (ES / EN)" style="width: auto; min-width: 38px; padding: 0 9px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em;">
          <span id="lang-toggle-label">ES</span>
        </button>

        <!-- Global Technical Settings (Theme, Language, DB Storage, Backups, Sensory & PWA) -->
        <button type="button" class="btn-icon" id="btn-settings" title="Configuración: tema, base de datos y copias de seguridad" aria-label="Configuración" data-i18n-title="Configuración: tema, base de datos y copias de seguridad" data-i18n-aria-label="Configuración">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Persistence & PWA Installation Warning Banner (Top, directly below header) -->
    <div id="persistence-warning-banner" class="persistence-warning-banner hidden" role="status" aria-live="polite"></div>

    <!-- Navigation Tabs (Ahora mismo | Yo | Evolución [Reloj]) -->
    <nav class="app-nav" aria-label="Navegación principal" data-i18n-aria-label="Navegación principal">
      <button type="button" class="nav-item active" data-nav-group="ahora-mismo" data-view="guia-inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"></path>
          <path d="M2 17c2-3 4-3 6 0s4 3 6 0 4-3 6 0"></path>
          <path d="M2 7c2-3 4-3 6 0s4 3 6 0 4-3 6 0"></path>
        </svg>
        <span data-i18n="Ahora mismo">Ahora mismo</span>
      </button>

      <button type="button" class="nav-item" data-nav-group="yo" data-view="perfil-valores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
        <span data-i18n="Yo">Yo</span>
      </button>

      <button type="button" class="nav-item nav-item-clock" data-nav-group="insight" data-view="insight" title="Evolución: Cuaderno de Terapia, Historial en Frío y Gráficos" aria-label="Evolución e Historial" data-i18n-title="Evolución: Cuaderno de Terapia, Historial en Frío y Gráficos" data-i18n-aria-label="Evolución e Historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </button>
    </nav>

    <!-- Contextual Sub-Navigation Bar -->
    <div id="context-subnav" class="context-subnav" aria-label="Sub-navegación del espacio actual"></div>

    <!-- Main Views Container -->
    <main class="app-main">
      <!-- Sub-App Guia: Selector Inicial ¿Qué necesitas ahora? -->
      <section id="guia-inicio-view" class="subapp-section active" aria-label="Guía de Inicio"></section>

      <!-- Sub-App 0: Mi Perfil ACT -->
      <section id="perfil-view" class="subapp-section" aria-label="Mi Perfil ACT"></section>

      <!-- Sub-App 1: El Espejo de la Paz Falsa -->
      <section id="paz-falsa-view" class="subapp-section" aria-label="El Espejo de la Paz Falsa"></section>

      <!-- Sub-App 2: El Espacio ACT (Crisis en Tiempo Real) -->
      <section id="espacio-act-view" class="subapp-section" aria-label="El Espacio ACT"></section>

      <!-- Sub-App 4: El Radar de Patrones (Laboratorio en Frío) -->
      <section id="radar-patrones-view" class="subapp-section" aria-label="El Radar de Patrones"></section>

      <!-- Sub-App 5: La Brújula de Valores (Micro-Clarificación) -->
      <section id="brujula-valores-view" class="subapp-section" aria-label="La Brújula de Valores"></section>

      <!-- Sub-App 6: Píldoras y Anclajes (Lecturas de 1 minuto) -->
      <section id="pildoras-anclajes-view" class="subapp-section" aria-label="Píldoras y Anclajes"></section>

      <!-- Sub-App 3: El Panel de Insight (Analítica y Evolución) -->
      <section id="insight-view" class="subapp-section" aria-label="El Panel de Insight"></section>
    </main>

    <!-- Persistent Global Footer -->
    <footer id="app-footer" class="app-footer">
      <div class="app-footer-main">
        <span>🌱 <strong>Khora</strong> · Tu espacio ACT · Creado con ❤️ por</span>
        <a id="footer-github-link" href="https://github.com/JCarrascoF/khora" target="_blank" rel="noopener noreferrer">@JCarrascoF</a>
        <span aria-hidden="true">·</span>
        <a id="footer-kofi-link" href="https://ko-fi.com/jcarrascof" target="_blank" rel="noopener noreferrer">☕ Apoyar en Ko-fi</a>
        <span aria-hidden="true">·</span>
        <button type="button" class="btn-inline-link" id="btn-footer-feedback">💬 Enviar Feedback</button>
      </div>
      <div class="app-footer-disclaimer">
        Herramienta gratuita y privada de práctica personal. No sustituye el acompañamiento de un profesional de la psicología.
      </div>
    </footer>

    <!-- Global Modal Dialog (Add Anchor / Re-analysis Note / Reader / Pattern) -->
    <div id="app-modal" class="modal-overlay" role="dialog" aria-modal="true">
      <div class="modal-card" id="modal-body"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Global Accessible Glossary Tooltip -->
    <div id="act-glossary-tooltip" class="act-glossary-tooltip" role="tooltip" aria-hidden="true"></div>
  </div>

  <!-- Full-Screen Privacy Lock Overlay (PIN / Password / Biometric AES-256) -->
  <div id="privacy-lock-overlay" class="privacy-lock-overlay hidden" role="dialog" aria-modal="true" aria-label="Bloqueo de Privacidad"></div>

  <!-- Scripts -->
  <script src="./js/i18n.js?v=3.1.0"></script>
  <script src="./js/state.js?v=3.1.0"></script>
  <script src="./js/subapp-perfil.js?v=3.1.0"></script>
  <script src="./js/subapp-paz-falsa.js?v=3.1.0"></script>
  <script src="./js/subapp-espacio-act.js?v=3.1.0"></script>
  <script src="./js/subapp-radar-patrones.js?v=3.1.0"></script>
  <script src="./js/subapp-brujula-valores.js?v=3.1.0"></script>
  <script src="./js/subapp-pildoras-anclajes.js?v=3.1.0"></script>
  <script src="./js/subapp-insight.js?v=3.1.0"></script>
  <script src="./js/app.js?v=3.1.0"></script>
</body>
</html>
