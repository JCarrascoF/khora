name: Bug report
description: Report a bug or unexpected behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Modo de uso
      description: ¿Cómo estabas usando Khora cuando apareció el problema?
      options:
        - "Estático (GitHub Pages / hosting estático)"
        - "SQLite (self-hosted con backend)"
        - "No estoy seguro"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Dispositivo
      options:
        - "Móvil (Android)"
        - "Móvil (iOS)"
        - "Escritorio (Chrome)"
        - "Escritorio (Firefox)"
        - "Escritorio (Safari)"
        - "Escritorio (otro)"
        - "Tablet"
        - "Otro"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador / Versión
      placeholder: "Chrome 126, Firefox 127, Safari 18..."
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: Versión de la app
      description: "Visible en el subapp Perfil (abajo). Ej: 3.1.0"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abro Khora...
        2. Voy a...
        3. Hago...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento real
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot / Extra
      description: "Si aplica, adjunta un screenshot o describe el contexto adicional."
    validations:
      required: false
